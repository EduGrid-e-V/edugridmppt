<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="title desc">
  <title id="title">Solar-panel I–V and P–V curves</title>
  <desc id="desc">Current and power are plotted against a shared voltage axis. Short-circuit current, open-circuit voltage, and the maximum power point are labelled.</desc>
  <rect width="800" height="440" fill="#fff"/>
  <style>
    text{font-family:Arial,sans-serif;fill:#111}.title{font-size:25px;font-weight:700}.label{font-size:17px}.small{font-size:14px}.axis{fill:none;stroke:#111;stroke-width:2}.grid{fill:none;stroke:#bbb;stroke-width:1}.iv{fill:none;stroke:#0065bd;stroke-width:5}.pv{fill:none;stroke:#555;stroke-width:5}.guide{fill:none;stroke:#444;stroke-width:1.5;stroke-dasharray:7 6}.mark{fill:#fff;stroke:#111;stroke-width:3}
  </style>
  <text class="title" x="400" y="36" text-anchor="middle">One voltage axis, two views of the panel</text>
  <g class="grid"><path d="M90 95H740M90 155H740M90 215H740M90 275H740M90 335H740"/><path d="M220 75V355M350 75V355M480 75V355M610 75V355"/></g>
  <path class="axis" d="M90 70V355H745"/>
  <text class="label" x="418" y="402" text-anchor="middle">Voltage V (V)</text>
  <text class="label" transform="translate(28 220) rotate(-90)" text-anchor="middle">Current I (A)</text>
  <text class="label" transform="translate(785 220) rotate(90)" text-anchor="middle">Power P (W)</text>
  <path class="iv" d="M90 105C260 105 440 108 545 120C625 129 674 162 700 225C716 265 728 316 733 355"/>
  <path class="pv" d="M90 355C230 310 360 244 475 167C536 127 586 111 622 133C680 168 716 269 733 355"/>
  <circle class="mark" cx="584" cy="119" r="8"/><circle class="mark" cx="584" cy="119" r="3" fill="#0065bd"/>
  <path class="guide" d="M584 119V355"/>
  <text class="label" x="597" y="96">MPP on both curves</text>
  <circle cx="90" cy="105" r="6" fill="#0065bd"/><text class="label" x="101" y="92">I_sc</text>
  <circle cx="733" cy="355" r="6" fill="#0065bd"/><text class="label" x="702" y="382">V_oc</text>
  <line x1="120" y1="52" x2="170" y2="52" class="iv"/><text class="small" x="182" y="57">I–V curve</text>
  <line x1="315" y1="52" x2="365" y2="52" class="pv"/><text class="small" x="377" y="57">P–V curve</text>
  <text class="small" x="400" y="428" text-anchor="middle">Power is zero at short circuit and open circuit, with a maximum between them.</text>
</svg>
