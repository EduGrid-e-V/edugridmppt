<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">PWM duty-cycle examples over three periods</title>
  <desc id="desc">Ten, fifty, and ninety percent PWM waveforms each repeat for three equal periods. Blue shading marks every high interval. A dimension line identifies one full period and another identifies the on-time.</desc>
  <rect width="900" height="520" fill="#fff"/>
  <style>
    text{font-family:Arial,sans-serif;fill:#171717}.title{font-size:27px;font-weight:700}.label{font-size:18px;font-weight:700}.small{font-size:14px}.axis{fill:none;stroke:#222;stroke-width:1.5}.wave{fill:none;stroke:#0065bd;stroke-width:4;stroke-linejoin:round;stroke-linecap:square}.on{fill:#dcecf8}.boundary{fill:none;stroke:#999;stroke-width:1;stroke-dasharray:4 5}.dimension{fill:none;stroke:#555;stroke-width:1.5}
  </style>
  <text class="title" x="450" y="38" text-anchor="middle">Duty cycle changes pulse width, not period</text>
  <text class="small" x="450" y="63" text-anchor="middle">Each row shows three complete periods. The rising edges stay equally spaced.</text>
  <g transform="translate(0 10)">
    <text class="label" x="58" y="135">10%</text><text class="small" x="58" y="157">short ON time</text>
    <g class="boundary"><path d="M210 92V170M390 92V170M570 92V170M750 92V170"/></g>
    <g class="on"><rect x="210" y="102" width="18" height="52"/><rect x="390" y="102" width="18" height="52"/><rect x="570" y="102" width="18" height="52"/></g>
    <path class="axis" d="M185 154H775"/><path class="wave" d="M210 154V102H228V154H390V102H408V154H570V102H588V154H750"/>
  </g>
  <g transform="translate(0 140)">
    <text class="label" x="58" y="135">50%</text><text class="small" x="58" y="157">equal ON / OFF</text>
    <g class="boundary"><path d="M210 92V170M390 92V170M570 92V170M750 92V170"/></g>
    <g class="on"><rect x="210" y="102" width="90" height="52"/><rect x="390" y="102" width="90" height="52"/><rect x="570" y="102" width="90" height="52"/></g>
    <path class="axis" d="M185 154H775"/><path class="wave" d="M210 154V102H300V154H390V102H480V154H570V102H660V154H750"/>
    <text class="small" x="255" y="129" text-anchor="middle">ON</text><text class="small" x="345" y="148" text-anchor="middle">OFF</text>
  </g>
  <g transform="translate(0 270)">
    <text class="label" x="58" y="135">90%</text><text class="small" x="58" y="157">long ON time</text>
    <g class="boundary"><path d="M210 92V170M390 92V170M570 92V170M750 92V170"/></g>
    <g class="on"><rect x="210" y="102" width="162" height="52"/><rect x="390" y="102" width="162" height="52"/><rect x="570" y="102" width="162" height="52"/></g>
    <path class="axis" d="M185 154H775"/><path class="wave" d="M210 154V102H372V154H390V102H552V154H570V102H732V154H750"/>
  </g>
  <path class="dimension" d="M210 486H390M210 479V493M390 479V493"/><text class="small" x="300" y="510" text-anchor="middle">one period T</text>
  <path class="dimension" d="M210 461H300M210 455V467M300 455V467"/><text class="small" x="255" y="452" text-anchor="middle">t<tspan baseline-shift="sub" font-size="11">on</tspan> at 50%</text>
  <text class="label" x="595" y="491">D = t<tspan baseline-shift="sub" font-size="12">on</tspan> / T</text><text class="small" x="595" y="512">frequency f = 1 / T</text>
</svg>
