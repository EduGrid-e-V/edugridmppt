<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="title desc">
  <title id="title">PWM duty-cycle examples</title>
  <desc id="desc">Square waves at ten, fifty, and ninety percent duty cycle. The on-time is shaded blue in each period.</desc>
  <rect width="800" height="440" fill="#fff"/>
  <style>
    text{font-family:Arial,sans-serif;fill:#111}.title{font-size:25px;font-weight:700}.label{font-size:18px;font-weight:700}.small{font-size:14px}.axis{stroke:#111;stroke-width:2}.wave{fill:none;stroke:#0065bd;stroke-width:4;stroke-linejoin:round}.on{fill:#0065bd;opacity:.18}.period{stroke:#555;stroke-width:1.5;stroke-dasharray:6 5}
  </style>
  <text class="title" x="400" y="38" text-anchor="middle">Same period, different ON time</text>
  <g transform="translate(0 0)"><text class="label" x="45" y="111">10%</text><rect class="on" x="140" y="76" width="52" height="62"/><path class="axis" d="M130 138H700"/><path class="wave" d="M140 138V76H192V138H660"/><path class="period" d="M140 62V155M660 62V155"/><text class="small" x="400" y="164" text-anchor="middle">one period T</text></g>
  <g transform="translate(0 120)"><text class="label" x="45" y="111">50%</text><rect class="on" x="140" y="76" width="260" height="62"/><path class="axis" d="M130 138H700"/><path class="wave" d="M140 138V76H400V138H660"/><path class="period" d="M140 62V155M660 62V155"/><text class="small" x="270" y="99" text-anchor="middle">ON</text><text class="small" x="530" y="130" text-anchor="middle">OFF</text></g>
  <g transform="translate(0 240)"><text class="label" x="45" y="111">90%</text><rect class="on" x="140" y="76" width="468" height="62"/><path class="axis" d="M130 138H700"/><path class="wave" d="M140 138V76H608V138H660"/><path class="period" d="M140 62V155M660 62V155"/></g>
  <text class="small" x="400" y="426" text-anchor="middle">Duty cycle D = ON time / period T. PWM frequency is 1 / T.</text>
</svg>
