<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" role="img" aria-labelledby="title desc">
  <title id="title">Perturb and Observe control flow</title>
  <desc id="desc">After an initial power measurement, the controller changes duty by one signed step, waits for the converter and sensor, measures new power, compares it with the previous power, either keeps or reverses direction, stores the new power, and returns to the perturb step.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 4L0 8Z" fill="#0065bd"/></marker></defs>
  <rect width="900" height="650" fill="#fff"/>
  <style>
    text{font-family:Arial,sans-serif;fill:#171717}.title{font-size:27px;font-weight:700}.label{font-size:16px;font-weight:700}.small{font-size:13px}.box{fill:#fff;stroke:#222;stroke-width:2}.decision{fill:#e8f3fb;stroke:#0065bd;stroke-width:2}.start{fill:#f2f2f2;stroke:#222;stroke-width:2}.flow{fill:none;stroke:#0065bd;stroke-width:3;marker-end:url(#arrow)}.loop{fill:none;stroke:#0065bd;stroke-width:3;marker-end:url(#arrow)}
  </style>
  <text class="title" x="450" y="38" text-anchor="middle">Perturb and Observe: change, measure, decide, repeat</text>
  <rect class="start" x="330" y="70" width="240" height="58" rx="28"/><text class="label" x="450" y="95" text-anchor="middle">Start / reset</text><text class="small" x="450" y="115" text-anchor="middle">measure and store P<tspan baseline-shift="sub" font-size="10">old</tspan></text>
  <path class="flow" d="M450 128V172"/>
  <rect class="box" x="325" y="172" width="250" height="66" rx="6"/><text class="label" x="450" y="200" text-anchor="middle">Perturb duty</text><text class="small" x="450" y="221" text-anchor="middle">D ← D + direction × step</text>
  <path class="flow" d="M450 238V282"/>
  <rect class="box" x="325" y="282" width="250" height="66" rx="6"/><text class="label" x="450" y="310" text-anchor="middle">Wait, then measure</text><text class="small" x="450" y="331" text-anchor="middle">P<tspan baseline-shift="sub" font-size="10">new</tspan> = V × I</text>
  <path class="flow" d="M450 348V390"/>
  <path class="decision" d="M450 390L575 455L450 520L325 455Z"/><text class="label" x="450" y="449" text-anchor="middle">Did power fall?</text><text class="small" x="450" y="471" text-anchor="middle">P<tspan baseline-shift="sub" font-size="10">new</tspan> &lt; P<tspan baseline-shift="sub" font-size="10">old</tspan></text>
  <path class="flow" d="M325 455H220V520"/><text class="label" x="260" y="443">YES</text>
  <rect class="box" x="110" y="520" width="220" height="66" rx="6"/><text class="label" x="220" y="548" text-anchor="middle">Reverse direction</text><text class="small" x="220" y="569" text-anchor="middle">direction ← −direction</text>
  <path class="flow" d="M575 455H680V520"/><text class="label" x="627" y="443">NO</text>
  <rect class="box" x="570" y="520" width="220" height="66" rx="6"/><text class="label" x="680" y="548" text-anchor="middle">Keep direction</text><text class="small" x="680" y="569" text-anchor="middle">the last move helped</text>
  <path class="flow" d="M330 553H398"/><path class="flow" d="M570 553H502"/>
  <rect class="box" x="398" y="530" width="104" height="46" rx="6"/><text class="small" x="450" y="549" text-anchor="middle">store</text><text class="small" x="450" y="567" text-anchor="middle">P<tspan baseline-shift="sub" font-size="10">old</tspan> ← P<tspan baseline-shift="sub" font-size="10">new</tspan></text>
  <path class="loop" d="M450 576V620H840V205H575"/><text class="small" x="755" y="610">next control interval</text>
</svg>
