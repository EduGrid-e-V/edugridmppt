<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc">
  <title id="title">Simplified EduGrid MPPT board schematic and control path</title>
  <desc id="desc">The power path runs from the PV panel through an input shunt, a P-channel switch, an inductor, an output shunt, and the load. A freewheel diode and capacitors connect to the common return. Two INA226 sensors report over I2C to the microcontroller, which drives the switch through a transistor gate driver.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 4L0 8Z" fill="#0065bd"/></marker>
    <marker id="arrow-dark" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 4L0 8Z" fill="#333"/></marker>
  </defs>
  <rect width="1000" height="650" fill="#fff"/>
  <style>
    text{font-family:Arial,sans-serif;fill:#171717}.title{font-size:27px;font-weight:700}.section{font-size:17px;font-weight:700}.label{font-size:15px;font-weight:700}.small{font-size:13px}.wire{fill:none;stroke:#222;stroke-width:3}.component{fill:#fff;stroke:#222;stroke-width:2}.sense{fill:#e8f3fb;stroke:#0065bd;stroke-width:2}.control{fill:none;stroke:#0065bd;stroke-width:3;marker-end:url(#arrow-blue)}.tap{fill:none;stroke:#0065bd;stroke-width:2}.current{fill:none;stroke:#333;stroke-width:2.5;marker-end:url(#arrow-dark)}.node{fill:#222}.ground{fill:none;stroke:#222;stroke-width:2}.note{fill:#f7f7f7;stroke:#aaa;stroke-width:1.5}
  </style>
  <text class="title" x="500" y="38" text-anchor="middle">EduGrid MPPT: power stage, measurement, and control</text>
  <text class="small" x="500" y="61" text-anchor="middle">Simplified from the project schematic; protection and decoupling parts are omitted.</text>
  <text class="section" x="35" y="98">POWER PATH</text>
  <path class="wire" d="M115 175H160M225 175H275M385 175H420M535 175H585M650 175H790"/>
  <path class="wire" d="M115 385H790"/>
  <path class="current" d="M125 135H250"/><text class="small" x="188" y="125" text-anchor="middle">panel current</text>
  <rect class="component" x="35" y="145" width="80" height="270" rx="6"/>
  <g stroke="#0065bd" stroke-width="2" fill="none"><rect x="52" y="205" width="46" height="80"/><path d="M75 205V285M52 245H98"/></g>
  <text class="label" x="75" y="315" text-anchor="middle">PV panel</text><text class="label" x="103" y="169">+</text><text class="label" x="103" y="391">−</text>
  <rect class="component" x="160" y="158" width="65" height="34" rx="3"/><text class="small" x="193" y="180" text-anchor="middle">0.1 Ω</text><text class="label" x="193" y="212" text-anchor="middle">Rshunt1</text>
  <rect class="component" x="275" y="145" width="110" height="60" rx="5"/><text class="label" x="330" y="169" text-anchor="middle">Q2</text><text class="small" x="330" y="189" text-anchor="middle">P-channel switch</text>
  <path class="wire" d="M420 175h15c8-28 25-28 33 0s25 28 33 0 25-28 34 0"/><text class="label" x="478" y="138" text-anchor="middle">L1  2.2 mH</text>
  <rect class="component" x="585" y="158" width="65" height="34" rx="3"/><text class="small" x="618" y="180" text-anchor="middle">0.1 Ω</text><text class="label" x="618" y="212" text-anchor="middle">Rshunt2</text>
  <path class="wire" d="M730 175V232M730 328V385"/><path class="component" d="M710 232H750V328H710Z"/><path class="wire" d="M710 248L750 264L710 280L750 296L710 312"/><text class="label" x="730" y="350" text-anchor="middle">Load</text>
  <path class="wire" d="M680 175V244M680 316V385M662 244H698M662 260H698"/><text class="small" x="704" y="337">Cout</text>
  <path class="wire" d="M397 175V236M397 314V385"/>
  <rect class="component" x="354" y="236" width="86" height="78" rx="4"/><text class="label" x="397" y="265" text-anchor="middle">D1 SS26</text><text class="small" x="397" y="287" text-anchor="middle">freewheel path</text><text class="small" x="397" y="304" text-anchor="middle">when Q2 is off</text>
  <path class="wire" d="M135 175V245M135 315V385M121 245H149M121 260H149"/><text class="small" x="153" y="337">Cin</text>
  <circle class="node" cx="135" cy="175" r="4"/><circle class="node" cx="397" cy="175" r="4"/><circle class="node" cx="680" cy="175" r="4"/><circle class="node" cx="730" cy="175" r="4"/>
  <path class="ground" d="M86 385H815M86 385v10M75 395h22M79 402h14M83 409h6"/><text class="small" x="815" y="391">common return</text>
  <text class="section" x="35" y="462">MEASUREMENT AND CONTROL</text>
  <rect class="sense" x="130" y="490" width="170" height="74" rx="6"/><text class="label" x="215" y="518" text-anchor="middle">INA226 #1</text><text class="small" x="215" y="541" text-anchor="middle">panel voltage + current</text>
  <path class="tap" d="M176 192V490M209 192V490"/>
  <rect class="sense" x="520" y="490" width="170" height="74" rx="6"/><text class="label" x="605" y="518" text-anchor="middle">INA226 #2</text><text class="small" x="605" y="541" text-anchor="middle">load voltage + current</text>
  <path class="tap" d="M600 192V490M635 192V490"/>
  <rect class="component" x="335" y="570" width="250" height="62" rx="6"/><text class="label" x="460" y="596" text-anchor="middle">Arduino / ESP32</text><text class="small" x="460" y="617" text-anchor="middle">calculate P → run MPPT rule → set PWM</text>
  <path class="control" d="M215 564V601H335"/><path class="control" d="M605 564V550H520V570"/>
  <rect class="sense" x="810" y="492" width="155" height="72" rx="6"/><text class="label" x="887" y="519" text-anchor="middle">Q1 gate driver</text><text class="small" x="887" y="541" text-anchor="middle">inverts / level shifts</text>
  <path class="control" d="M585 590H760V528H810"/><path class="control" d="M810 510H800V115H330V145"/><text class="small" x="650" y="578">PWM command</text>
  <rect class="note" x="810" y="270" width="155" height="92" rx="5"/><text class="label" x="887" y="296" text-anchor="middle">Human input</text><text class="small" x="827" y="320">• slide potentiometer</text><text class="small" x="827" y="341">• mode button</text>
  <path class="control" d="M810 320H780V642H460V632"/><text class="small" x="650" y="637">manual duty / mode</text>
</svg>
