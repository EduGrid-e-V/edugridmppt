n de cada período PWM durante la cual el interruptor está encendido. Cambiarlo modifica la carga que ve el panel."],["PV simulation controls","PV-Simulationssteuerung","Controles de simulación fotovoltaica"],["Rooftop solar simulation","Simulation einer Dach-PV-Anlage","Simulación solar sobre un tejado"],["Sun position","Sonnenstand","Posición del sol"],["Cloud cover","Bewölkung","Nubosidad"],["Ambient temperature","Umgebungstemperatur","Temperatura ambiente"],["fixed at 25 Ω in this simulation.","in dieser Simulation fest auf 25 Ω eingestellt.","fijada en 25 Ω en esta simulación."],["fixed 25 Ω in this simulation.","in dieser Simulation fest 25 Ω.","fija en 25 Ω en esta simulación."],["Panel characteristic","Modulkennlinie","Característica del panel"],["I–V curve","U-I-Kennlinie","Curva I–V"],["Chart legend","Diagrammlegende","Leyenda del gráfico"],["Live point","Aktueller Punkt","Punto actual"],["Press Start Sweep to measure the full I–V curve","Kennlinie messen, um die vollständige U-I-Kurve zu sehen","Mide la curva para ver la característica I–V completa"],["Voltage (V)","Spannung (V)","Tensión (V)"],["Current (A)","Strom (A)","Corriente (A)"],["Power (W)","Leistung (W)","Potencia (W)"],["Voltage current characteristic chart","Diagramm der Spannungs-Strom-Kennlinie","Gráfico de la característica tensión-corriente"],["Live response","Live-Verlauf","Respuesta en directo"],["Power over time chart","Diagramm der Leistung im Zeitverlauf","Gráfico de potencia a lo largo del tiempo"],["Time (s)","Zeit (s)","Tiempo (s)"],["Real ESP32 experiment","Realer ESP32-Versuch","Experimento real con ESP32"],["Standalone simulation","Eigenständige Simulation","Simulación independiente"],["Student / Berry Algorithm Lab","Algorithmuslabor für Schüler / Berry","Laboratorio de algoritmos del estudiante / Berry"],["Web Worker","Web Worker","Proceso web"],["Your task:","Deine Aufgabe:","Tu tarea:"],["Change the converter duty cycle so that PV.getPower() becomes as large as possible.","Ändere den Duty cycle des Wandlers so, dass PV.getPower() möglichst groß wird.","Cambia el Duty cycle del convertidor para que PV.getPower() sea lo mayor posible."],["The ESP32 calls mppt() every 100 ms.","Der ESP32 ruft mppt() alle 100 ms auf.","El ESP32 llama a mppt() cada 100 ms."],["The simulator calls mppt() every 100 ms.","Der Simulator ruft mppt() alle 100 ms auf.","El simulador llama a mppt() cada 100 ms."],["Berry code editor","Berry-Code-Editor","Editor de código Berry"],["Install & Run","Installieren und starten","Instalar e iniciar"],["Run","Starten","Iniciar"],["Pause","Pausieren","Pausar"],["Single Step","Einzelschritt","Paso único"],["Reset","Zurücksetzen","Reiniciar"],["Benchmark","Benchmark","Benchmark"],["Benchmarking…","Benchmark läuft…","Benchmark en curso…"],["Every","Alle","Cada"],["1 second","1 Sekunde","1 segundo"],["30 seconds","30 Sekunden","30 segundos"],["1 minute","1 Minute","1 minuto"],["5 minutes","5 Minuten","5 minutos"],["Stop logging","Aufzeichnung stoppen","Detener registro"],["Start logging","Aufzeichnung starten","Iniciar registro"],["Stops recording and closes the CSV file.","Beendet die Aufzeichnung und schließt die CSV-Datei.","Detiene el registro y cierra el archivo CSV."],["Experiment logging","Versuchsaufzeichnung","Registro del experimento"],["Record measured PV voltage/current, load voltage/current, and duty cycle to a CSV on the ESP32. A blank load value means its sensor was unavailable.","Zeichne PV-Spannung und -Strom, Lastspannung und -strom sowie den Duty cycle als CSV auf dem ESP32 auf. Ein leeres Lastfeld bedeutet, dass der Sensor nicht verfügbar war.","Guarda la tensión y corriente FV, la tensión y corriente de la carga y el Duty cycle en un CSV del ESP32. Un campo de carga vacío indica que su sensor no estaba disponible."],["Choose an interval from Start logging to begin recording.","Wähle unter „Aufzeichnung starten“ ein Intervall, um die Aufzeichnung zu beginnen.","Elige un intervalo en «Iniciar registro» para comenzar la grabación."],["Recording:","Aufzeichnung:","Grabando:"],["log budget used.","des Speicherbudgets belegt.","del espacio de registro utilizado."],["A filesystem update can erase recordings. Download files you want to keep before updating.","Ein Dateisystem-Update kann Aufzeichnungen löschen. Lade wichtige Dateien vorher herunter.","Una actualización del sistema de archivos puede borrar grabaciones. Descarga antes las que quieras conservar."],["Benchmark intro","Dein Programm wird über einen ganzen Tag von 06:00 bis 18:00 getestet. Wolkenfelder und schnelle Schwankungen stören den klaren Tagesverlauf. Die Simulation startet bei 20 % Duty cycle und ruft mppt() mit 10 Hz auf – insgesamt 432.000-mal.","Tu programa se prueba durante un día completo, de 06:00 a 18:00. Las nubes y fluctuaciones rápidas alteran el día despejado. La simulación empieza con un Duty cycle del 20 % y llama a mppt() a 10 Hz: 432.000 veces en total."],["Irradiance from sunrise to sunset on a fluctuating benchmark day","Einstrahlung von Sonnenaufgang bis Sonnenuntergang an einem wechselhaften Benchmark-Tag","Irradiancia desde el amanecer hasta la puesta de sol en un día de Benchmark con fluctuaciones"],["Benchmark explanation","Die gewonnene Energie wird über den Tag aufsummiert und in Wattstunden (Wh; 1 Wh = 3600 J) angegeben. Der Tracking-Wert vergleicht sie mit der Energie eines idealen Reglers am maximalen Leistungspunkt. Ein fester Duty cycle verliert Energie, wenn sich der optimale Betriebspunkt verschiebt.","La energía obtenida se acumula durante el día y se muestra en vatios-hora (Wh; 1 Wh = 3600 J). La puntuación de seguimiento la compara con la energía de un regulador ideal en el punto de máxima potencia. Un Duty cycle fijo pierde energía cuando cambia el punto óptimo."],["Benchmark results","Benchmark-Ergebnisse","Resultados del Benchmark"],["Benchmark print output suppressed ({count} lines).","Benchmark-Ausgabe unterdrückt ({count} Zeilen).","Salida del Benchmark omitida ({count} líneas)."],["of available energy","der verfügbaren Energie","de la energía disponible"],["Wh harvested /","Wh gewonnen /","Wh obtenidos /"],["Wh available","Wh verfügbar","Wh disponibles"],["Firmware-compatible API","Firmware-kompatible API","API compatible con el firmware"],["chooses a duty directly.","setzt den Duty cycle direkt.","establece directamente el Duty cycle."],["changes it relative to the current value.","ändert ihn relativ zum aktuellen Wert.","lo cambia con respecto al valor actual."],["Buck Converter:","Buck Converter:","Buck Converter:"],["At the same irradiance, increasing duty usually draws more panel current and lowers panel voltage; decreasing duty does the opposite.","Bei gleicher Einstrahlung zieht ein höherer Duty cycle normalerweise mehr Strom aus dem PV-Modul und senkt dessen Spannung; ein niedrigerer Duty cycle bewirkt das Gegenteil.","Con la misma irradiancia, aumentar el Duty cycle normalmente extrae más corriente del panel y reduce su tensión; reducirlo produce el efecto contrario."],["Compile diagnostics","Kompiliermeldungen","Mensajes de compilación"],["Waiting for the interpreter…","Warte auf den Interpreter…","Esperando al intérprete…"],["No healthy Berry program is currently running on the ESP32. Install a valid program; runtime errors and timeouts stop PWM at minimum duty.","Auf dem ESP32 läuft derzeit kein funktionsfähiges Berry-Programm. Installiere ein gültiges Programm; Fehler setzen PWM auf den minimalen Tastgrad.","No hay ningún programa Berry válido en el ESP32. Instala uno válido; los errores detienen el PWM en el ciclo mínimo."],["Console","Konsole","Consola"],["Auto-scroll","Automatisch scrollen","Desplazamiento automático"],["Program output will appear here.","Die Programmausgabe erscheint hier.","La salida del programa aparecerá aquí."],["changes duty but prints nothing. Use","ändert den Duty cycle, gibt aber nichts aus. Verwende","cambia el Duty cycle pero no imprime nada. Usa"],["when you want console output.","für eine Konsolenausgabe.","cuando quieras ver salida en la consola."],["Controls","Bedienung","Controles"],["Calls mppt() repeatedly until paused.","Ruft mppt() wiederholt auf, bis pausiert wird.","Llama a mppt() repetidamente hasta que se pause."],["Pauses repeated mppt() calls.","Pausiert die wiederholten mppt()-Aufrufe.","Pausa las llamadas repetidas a mppt()."],["Algorithm hints","Algorithmus-Hinweise","Consejos sobre el algoritmo"],["calls mppt() once. Watch the live API values and duty.","ruft mppt() einmal auf. Beobachte die API-Livewerte und den Duty cycle.","llama a mppt() una vez. Observa los valores de la API y el Duty cycle."],["compiles this program on the ESP32, preserves the previous valid program if compilation fails, then enters Auto mode.","kompiliert das Programm auf dem ESP32, behält bei einem Fehler das bisherige Programm und schaltet in den Automatikmodus.","compila el programa en el ESP32, conserva el anterior si falla y entra en modo automático."],["If power increased, try another small change in the same direction.","Wenn die Leistung gestiegen ist, ändere den Duty cycle erneut leicht in dieselbe Richtung.","Si la potencia aumentó, prueba otro pequeño cambio del Duty cycle en la misma dirección."],["If power decreased, reverse the direction of the duty change.","Wenn die Leistung gesunken ist, kehre die Änderungsrichtung um.","Si la potencia disminuyó, invierte la dirección del cambio."],["repeats those steps;","wiederholt diese Schritte;","repite esos pasos;"],["freezes them;","hält sie an;","los pausa;"],["clears Berry variables and restores the starting state.","löscht die Berry-Variablen und stellt den Anfangszustand wieder her.","borra las variables Berry y restaura el estado inicial."],["runs the same program through a deterministic cloudy day and compares harvested energy.","testet dasselbe Programm an einem deterministischen bewölkten Tag und vergleicht die gewonnene Energie.","prueba el mismo programa durante un día nublado determini
