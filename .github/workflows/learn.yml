name: Learning site

on:
  push:
    paths:
      - 'learn/**'
      - 'packages/**'
      - '.github/workflows/learn.yml'
  pull_request:
    paths:
      - 'learn/**'
      - 'packages/**'
      - '.github/workflows/learn.yml'

jobs:
  learn:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: learn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: learn/package-lock.json
      - run: npm ci
      - run: npm run check

  pv-sim:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/pv-sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/pv-sim/package-lock.json
      - run: npm ci
      - run: npm run check
